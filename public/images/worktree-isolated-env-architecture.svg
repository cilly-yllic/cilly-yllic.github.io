<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" role="img" aria-label="3 つの入口から単一の CLI を経由して worktree 専用環境を操作し、フックがライフサイクルを管理する構成図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="540" rx="10" fill="#faf9f7"/>

  <!-- title -->
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#27272a">worktree 1 つ = 使い捨て隔離環境 1 つ</text>

  <!-- entrances -->
  <rect x="30" y="56" width="220" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="140" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">① ランチャー</text>
  <text x="140" y="97" text-anchor="middle" font-size="10.5" fill="#4f46e5">起動と同時に環境構築</text>

  <rect x="270" y="56" width="220" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="380" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">② ターミナル直叩き</text>
  <text x="380" y="97" text-anchor="middle" font-size="10.5" fill="#4f46e5">エージェント不要・トークン 0</text>

  <rect x="510" y="56" width="220" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="620" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">③ 自然言語（スキル）</text>
  <text x="620" y="97" text-anchor="middle" font-size="10.5" fill="#4f46e5">依頼をコマンドに翻訳するだけ</text>

  <!-- arrows to CLI -->
  <path d="M140,114 L320,158" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M380,114 L380,158" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M620,114 L440,158" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- CLI -->
  <rect x="180" y="160" width="400" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="380" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">CLI スクリプト（唯一の正・決定論・冪等）</text>
  <text x="380" y="207" text-anchor="middle" font-size="11" fill="#b45309">create / up / stop / start / status / list / remove / doctor / clean</text>

  <!-- hooks -->
  <rect x="30" y="270" width="200" height="180" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.4"/>
  <text x="50" y="296" font-size="13" font-weight="700" fill="#27272a">Claude Code フック</text>
  <rect x="46" y="308" width="168" height="38" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="130" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#3f3f46">WorktreeCreate</text>
  <text x="130" y="339" text-anchor="middle" font-size="10" fill="#71717a">作成そのものを乗っ取る</text>
  <rect x="46" y="352" width="168" height="38" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="130" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#3f3f46">SessionStart</text>
  <text x="130" y="383" text-anchor="middle" font-size="10" fill="#71717a">自動再開 + 接続情報を注入</text>
  <rect x="46" y="396" width="168" height="38" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="130" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#3f3f46">SessionEnd</text>
  <text x="130" y="427" text-anchor="middle" font-size="10" fill="#71717a">自動停止（データは保持）</text>

  <!-- arrow hooks -> CLI -->
  <path d="M170,268 L280,228" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="150" y="250" font-size="10.5" fill="#71717a">CLI を呼ぶ</text>

  <!-- arrow CLI -> env -->
  <path d="M420,226 L420,266" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="432" y="250" font-size="10.5" fill="#71717a">作成 / 起動 / 破棄</text>

  <!-- env -->
  <rect x="260" y="270" width="320" height="240" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="280" y="296" font-size="13" font-weight="700" fill="#065f46">worktree 専用環境（使い捨て）</text>
  <rect x="276" y="308" width="288" height="40" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="420" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">git worktree（専用ブランチ）</text>
  <text x="420" y="340" text-anchor="middle" font-size="10" fill="#047857">コードの隔離</text>
  <rect x="276" y="354" width="140" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="346" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">専用 DB コンテナ</text>
  <text x="346" y="389" text-anchor="middle" font-size="10" fill="#047857">内容由来 ID で名前空間化</text>
  <rect x="424" y="354" width="140" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="494" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">dev サーバ</text>
  <text x="494" y="389" text-anchor="middle" font-size="10" fill="#047857">動的ポート採番</text>
  <rect x="276" y="412" width="288" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="420" y="431" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">runtime.json（環境の記録・唯一の正）</text>
  <text x="420" y="447" text-anchor="middle" font-size="10" fill="#047857">実ポート / URL / PID / 状態 — 破棄はこの記録から</text>
  <text x="420" y="492" text-anchor="middle" font-size="10.5" fill="#047857">remove で down -v まで含めて全て消える（ブランチは保持）</text>

  <!-- main env (untouched) -->
  <rect x="610" y="270" width="120" height="240" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="670" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#3f3f46">メイン環境</text>
  <text x="670" y="322" text-anchor="middle" font-size="10.5" fill="#71717a">通常チェックアウト</text>
  <text x="670" y="340" text-anchor="middle" font-size="10.5" fill="#71717a">ポート / DB / 設定</text>
  <rect x="622" y="360" width="96" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="670" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">一切触れない</text>
  <text x="670" y="416" text-anchor="middle" font-size="10" fill="#71717a">リポジトリ無改変</text>
  <text x="670" y="432" text-anchor="middle" font-size="10" fill="#71717a">（外付け override のみ）</text>
</svg>
